services:
  mysql:
    image: mysql:8.0
    container_name: ticket-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticket_booking
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-booking-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticket_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: "default"
    ports:
      - "8080:8080"
    networks:
      - ticket-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-booking-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "5173:80"
    networks:
      - ticket-network

volumes:
  mysql_data:

networks:
  ticket-network:
    driver: bridge
